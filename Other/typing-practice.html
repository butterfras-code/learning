<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypoForge</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Special+Elite&family=Patrick+Hand&display=swap');
        
        body { margin: 0; padding: 0; overflow-x: hidden; }
        
        .font-space { font-family: 'Space Mono', monospace; }
        .font-typewriter { font-family: 'Special Elite', cursive; }
        .font-handwritten { font-family: 'Patrick Hand', cursive; font-size: 1.25em; line-height: 1.4; }

        .bg-paper-texture {
            background-image: url("data:image/svg+xml,%3Csvg width='150' height='150' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='150' height='150' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
        }

        @keyframes rainbowBg {
            0% { background-color: #ff0000; box-shadow: 0 0 10px #ff0000; }
            20% { background-color: #ff9900; box-shadow: 0 0 10px #ff9900; }
            40% { background-color: #33cc33; box-shadow: 0 0 10px #33cc33; }
            60% { background-color: #3399ff; box-shadow: 0 0 10px #3399ff; }
            80% { background-color: #cc33cc; box-shadow: 0 0 10px #cc33cc; }
            100% { background-color: #ff0000; box-shadow: 0 0 10px #ff0000; }
        }
        .cursor-rainbow { animation: rainbowBg 0.5s linear infinite; opacity: 0.7; }
        
        @keyframes box-explode {
            0% { transform: scale(1); opacity: 0.8; border-width: 2px; }
            100% { transform: scale(2.5) rotate(10deg); opacity: 0; border-width: 0px; }
        }
        .animate-box-explode {
            animation: box-explode 0.35s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes rainbow-particle-explosion {
            0% {
            box-shadow: 0 0 0 -2px #ff0000, 0 0 0 -2px #ff9900, 0 0 0 -2px #33cc33, 0 0 0 -2px #3399ff, 0 0 0 -2px #cc33cc, 0 0 0 -2px #ff0000, 0 0 0 -2px #ff9900, 0 0 0 -2px #33cc33;
            opacity: 1; transform: scale(1);
            }
            100% {
            box-shadow: -30px -30px 0 -2px #ff0000, 0 -40px 0 -2px #ff9900, 30px -30px 0 -2px #33cc33, 40px 0 0 -2px #3399ff, 30px 30px 0 -2px #cc33cc, 0 40px 0 -2px #ff0000, -30px 30px 0 -2px #ff9900, -40px 0 0 -2px #33cc33;
            opacity: 0; transform: scale(1.5);
            }
        }
        .animate-rainbow-particles {
            animation: rainbow-particle-explosion 0.4s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        .invert-on-hover { transition: all 0.2s ease; cursor: pointer; }
        .invert-on-hover:hover {
            background-color: var(--theme-ink) !important;
            color: var(--theme-surface) !important;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const BRUTALIST_THEMES = {
            'Gold': { surface: '#E8E8E8', panel: '#FFD12B', ink: '#121212' },
            'Dark Gold': { surface: '#360467', panel: '#121212', ink: '#FFD12B' },
            'Blueprint': { surface: '#0B1C2D', panel: '#257EA5', ink: '#FFFFFF' },
            'Terminal': { surface: '#1E4620', panel: '#121212', ink: '#4AF626' },
            'Ember': { surface: '#21110B', panel: '#C45229', ink: '#ecdac3' },
            'Inkberry': { surface: '#BDDCEF', panel: '#FACFCC', ink: '#1E0C27' },
            'Sagewinkle': { surface: '#D7DFF4', panel: '#DAE6C1', ink: '#140E20' },
            'Nocturne': { surface: '#140E20', panel: '#24222E', ink: '#D7DFF4' },
            'Witchwood': { surface: '#2C0A43', panel: '#0F1905', ink: '#f1dfb7' },
            'Hemoshine': { surface: '#3A0F1F', panel: '#7A0000', ink: '#E9F4FF' },
            'Cyan': { surface: '#ffd12b', panel: '#00D9FF', ink: '#121212' },
            'Dark Cyan': { surface: '#360467', panel: '#121212', ink: '#00D9FF' },
            'Lime': { surface: '#D6FF5D', panel: '#E3FF91', ink: '#140E20' },
            'Chrome Wire': { surface: '#E8E8E8', panel: '#7B7B7B', ink: '#121212' },
            'Ultra': { surface: '#360467', panel: '#7D00FF', ink: '#F2EAD3' },
            'Dark Ultra': { surface: '#e8e8e8', panel: '#121212', ink: '#7D00FF' },
            'Void': { surface: '#5b00bd', panel: '#121212', ink: '#E8E8E8' },
            'Cream': { surface: '#d3f2ea', panel: '#F2EAD3', ink: '#3c3625' },
            'Ink': { surface: '#3c3625', panel: '#121212', ink: '#F2EAD3' },
            'Paper': { surface: '#ffffff', panel: '#E8E8E8', ink: '#112764' },
        };

        const FONTS = {
            mono: 'font-mono',
            sans: 'font-sans',
            serif: 'font-serif',
            space: 'font-space',
            typewriter: 'font-typewriter',
            handwritten: 'font-handwritten',
        };

        const CURSORS = {
            line: 'border-l-[3px] border-current animate-pulse',
            underline: 'border-b-[3px] border-current animate-pulse',
            'neon-pulse': 'border-l-[4px] shadow-[0_0_10px_currentColor,0_0_20px_currentColor] animate-pulse',
            'rainbow-vomit': 'cursor-rainbow shadow-lg',
            'pulsing-box': 'cursor-pulsing-box',
            'exploding-rainbow-vomit': 'cursor-rainbow shadow-lg' 
        };

        const CHUNK_SIZE = 1500;
        const BRUTALIST_ERROR_RED = '#FF003C'; 

        const normalizeText = (text) => text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
        const DEFAULT_TEXT = normalizeText("Drag and drop a .txt file here, or paste some text/code to get started.\n\nfunction greet(name) {\n  console.log(`Hello, ${name}!`);\n}\n\nOnce you drop a file or paste text, you can start typing immediately.");

        function App() {
            const [sourceText, setSourceText] = useState(DEFAULT_TEXT);
            const [currentChunkIndex, setCurrentChunkIndex] = useState(0);
            const [typedChars, setTypedChars] = useState('');
            
            const [status, setStatus] = useState('idle'); 
            const [startTime, setStartTime] = useState(null);
            const [sessionStartLength, setSessionStartLength] = useState(0);
            
            const [theme, setTheme] = useState('Gold');
            const [colorMode, setColorMode] = useState('3-color'); // '2-color' or '3-color'
            const [font, setFont] = useState('space');
            const [cursorStyle, setCursorStyle] = useState('block');
            
            // Mechanics settings
            const [isCodeMode, setIsCodeMode] = useState(true);
            const [ignoreCaps, setIgnoreCaps] = useState(false);
            const [tolerantWhitespace, setTolerantWhitespace] = useState(true);
            
            // Typography settings
            const [fontSize, setFontSize] = useState(24);
            const [letterSpacing, setLetterSpacing] = useState(0);

            const typingAreaRef = useRef(null);

            // Active Theme Derivation
            const activeTheme = BRUTALIST_THEMES[theme] || BRUTALIST_THEMES['Gold'];
            const currentSurface = colorMode === '2-color' ? activeTheme.panel : activeTheme.surface;
            const currentPanel = activeTheme.panel;
            const currentInk = activeTheme.ink;

            const textChunks = useMemo(() => {
                const chunks = [];
                for (let i = 0; i < sourceText.length; i += CHUNK_SIZE) {
                    chunks.push(sourceText.slice(i, i + CHUNK_SIZE));
                }
                return chunks.length ? chunks : [''];
            }, [sourceText]);

            const currentText = textChunks[currentChunkIndex] || '';

            const syntaxClasses = useMemo(() => {
                const classes = new Array(currentText.length).fill(null);
                if (!isCodeMode) return classes;

                const apply = (regex, styling) => {
                    let match;
                    while ((match = regex.exec(currentText)) !== null) {
                        if (match[0].length === 0) break;
                        for (let i = 0; i < match[0].length; i++) {
                            classes[match.index + i] = styling;
                        }
                    }
                };

                // Apply opacity, weight, and style instead of hardcoded colors
                apply(/\b(const|let|var|function|return|if|else|for|while|import|from|export|default|class|switch|case|break)\b/g, 'font-bold opacity-100');
                apply(/\b\d+\b/g, 'font-bold opacity-70');
                apply(/\b([a-zA-Z_$][0-9a-zA-Z_$]*)\s*(?=\()/g, 'italic opacity-100');
                apply(/(["'`])(?:(?=(\\?))\2|[\s\S])*?\1/g, 'opacity-70'); 
                apply(/\/\/.*|\/\*[\s\S]*?\*\//g, 'italic opacity-40');

                return classes;
            }, [currentText, isCodeMode]);

            const stats = useMemo(() => {
                if (!startTime || typedChars.length <= sessionStartLength) return { wpm: 0, accuracy: 100 };
                
                let correctCount = 0;
                for (let i = sessionStartLength; i < typedChars.length; i++) {
                    const typed = typedChars[i];
                    const expected = currentText[i];
                    
                    let match = typed === expected;
                    if (!match && ignoreCaps && typed.toLowerCase() === expected.toLowerCase()) match = true;
                    if (!match && tolerantWhitespace && (typed === ' ' || typed === '\n') && (expected === ' ' || expected === '\n')) match = true;
                    
                    if (match) correctCount++;
                }

                const minutesElapsed = (Date.now() - startTime) / 60000;
                const wpm = minutesElapsed > 0 ? Math.round((correctCount / 5) / minutesElapsed) : 0;
                
                const typedSinceStart = typedChars.length - sessionStartLength;
                const accuracy = typedSinceStart > 0 ? Math.round((correctCount / typedSinceStart) * 100) : 100;

                return { wpm, accuracy, correctCount };
            }, [typedChars, currentText, startTime, sessionStartLength, ignoreCaps, tolerantWhitespace]);

            const handleKeyDown = (e) => {
                if (e.key === ' ' && e.target === typingAreaRef.current) e.preventDefault();
                if (e.ctrlKey || e.metaKey || e.altKey) return;
                if (e.key === 'Shift' || e.key === 'CapsLock' || e.key === 'Tab') return;

                if (status === 'finished_chunk' && e.key === 'Enter') {
                    e.preventDefault();
                    nextChunk();
                    return;
                }

                if (e.key === 'Backspace') {
                    setTypedChars(prev => prev.slice(0, -1));
                    return;
                }

                const nextExpected = currentText[typedChars.length];
                const isToleratedEnter = tolerantWhitespace && e.key === ' ' && nextExpected === '\n';
                const isToleratedSpace = tolerantWhitespace && e.key === 'Enter' && nextExpected === ' ';

                // SMART WHITESPACE SKIP
                if (nextExpected && /\s/.test(nextExpected) && e.key.length === 1 && e.key !== 'Enter' && e.key !== ' ' && !isToleratedEnter && !isToleratedSpace) {
                    let skipCount = 0;
                    while (
                        typedChars.length + skipCount < currentText.length &&
                        /\s/.test(currentText[typedChars.length + skipCount])
                    ) {
                        skipCount++;
                    }
                    const nextVisibleChar = currentText[typedChars.length + skipCount];
                    
                    let isVisibleMatch = e.key === nextVisibleChar;
                    if (!isVisibleMatch && ignoreCaps && nextVisibleChar && e.key.toLowerCase() === nextVisibleChar.toLowerCase()) {
                        isVisibleMatch = true;
                    }

                    if (isVisibleMatch) {
                        const charsToAppend = currentText.substring(typedChars.length, typedChars.length + skipCount) + e.key;
                        processKeystroke(charsToAppend);
                        return;
                    }
                }

                // SMART ENTER / TOLERANT SKIP
                if (e.key === 'Enter' || isToleratedEnter) {
                    e.preventDefault();
                    if (nextExpected === '\n' || isToleratedEnter) {
                        let skipCount = 0;
                        let foundNewline = false;
                        
                        while (typedChars.length + skipCount < currentText.length) {
                            const char = currentText[typedChars.length + skipCount];
                            if (char === '\n') {
                                if (foundNewline) break; 
                                foundNewline = true;
                                skipCount++;
                            } else if (char === ' ' || char === '\t') {
                                skipCount++;
                            } else {
                                break;
                            }
                        }
                        if (skipCount > 0) {
                            processKeystroke(currentText.substring(typedChars.length, typedChars.length + skipCount));
                        }
                    } else {
                        processKeystroke('\n'); 
                    }
                    return;
                }

                if (isToleratedSpace) {
                    e.preventDefault();
                    processKeystroke(' ');
                    return;
                }

                if (e.key.length === 1) {
                    processKeystroke(e.key);
                }
            };

            const processKeystroke = (chars) => {
                if (status === 'idle') {
                    setStatus('typing');
                    setStartTime(Date.now());
                    setSessionStartLength(typedChars.length);
                }

                if (typedChars.length < currentText.length) {
                    setTypedChars(prev => {
                        const nextTyped = prev + chars;
                        if (nextTyped.length >= currentText.length) {
                            if (currentChunkIndex < textChunks.length - 1) {
                                setStatus('finished_chunk');
                            } else {
                                setStatus('finished_all');
                            }
                        }
                        return nextTyped;
                    });
                }
            };

            useEffect(() => {
                if (typingAreaRef.current && status !== 'finished_all') {
                    typingAreaRef.current.focus();
                }
            }, [status]);

            const handleDrop = (e) => {
                e.preventDefault();
                const file = e.dataTransfer?.files[0] || e.target.files?.[0];
                if (!file) return;

                if (file.name.match(/\.(js|jsx|ts|tsx|py|html|css|json)$/)) setIsCodeMode(true);

                const reader = new FileReader();
                reader.onload = (event) => {
                    setSourceText(normalizeText(event.target.result));
                    resetProgress();
                };
                reader.readAsText(file);
            };

            const handlePaste = (e) => {
                const text = e.clipboardData.getData('text');
                if (text) {
                    setSourceText(normalizeText(text));
                    resetProgress();
                }
            };

            const handleJumpToPosition = (index) => {
                setTypedChars(currentText.slice(0, index));
                setStatus('idle');
                setStartTime(null);
                setSessionStartLength(index);
                if (typingAreaRef.current) typingAreaRef.current.focus();
            };

            const resetProgress = () => {
                setTypedChars('');
                setCurrentChunkIndex(0);
                setStatus('idle');
                setStartTime(null);
                setSessionStartLength(0);
                if (typingAreaRef.current) typingAreaRef.current.focus();
            };

            const nextChunk = () => {
                setCurrentChunkIndex(prev => prev + 1);
                setTypedChars('');
                setStatus('idle');
                setStartTime(null);
                setSessionStartLength(0);
            };

            const renderText = () => {
                return currentText.split('').map((char, index) => {
                    let charStatus = 'untyped'; 
                    if (index < typedChars.length) {
                        let match = typedChars[index] === char;
                        if (!match && ignoreCaps && typedChars[index].toLowerCase() === char.toLowerCase()) match = true;
                        if (!match && tolerantWhitespace && (typedChars[index] === ' ' || typedChars[index] === '\n') && (char === ' ' || char === '\n')) match = true;
                        charStatus = match ? 'correct' : 'error';
                    }

                    const isCurrent = index === typedChars.length && status !== 'finished_chunk' && status !== 'finished_all';
                    const isJustTypedCorrectly = index === typedChars.length - 1 && charStatus === 'correct';
                    
                    let textClasses = 'transition-opacity duration-75 cursor-pointer hover:opacity-100';
                    let textStyleObj = {};
                    
                    if (charStatus === 'correct') {
                        textClasses += ` ${syntaxClasses[index] || 'opacity-100'}`;
                    } else if (charStatus === 'error') {
                        textClasses += ' line-through opacity-100';
                        textStyleObj = { color: BRUTALIST_ERROR_RED, backgroundColor: `${BRUTALIST_ERROR_RED}33` };
                    } else {
                        textClasses += ' opacity-30';
                    }

                    // True Inverted Block Cursor
                    if (isCurrent && cursorStyle === 'block') {
                        textClasses = textClasses.replace('opacity-30', '');
                        textClasses += ' opacity-100 animate-pulse';
                        textStyleObj.backgroundColor = currentInk;
                        textStyleObj.color = currentSurface;
                    }

                    let displayChar = charStatus === 'error' ? typedChars[index] : char;

                    if (displayChar === '\n') {
                        displayChar = '↵\n';
                    } else if (displayChar === ' ' && charStatus === 'error') {
                        displayChar = '·'; 
                    }

                    // Preserve layout structure for missed carriage returns
                    if (char === '\n' && !displayChar.includes('\n')) {
                        displayChar += '\n';
                    }

                    const needsRelative = isCurrent || (isJustTypedCorrectly && (cursorStyle === 'pulsing-box' || cursorStyle === 'exploding-rainbow-vomit'));

                    return (
                        <span 
                            key={index} 
                            onClick={() => handleJumpToPosition(index)}
                            className={`
                                ${textClasses} 
                                ${needsRelative ? 'relative' : ''}
                            `}
                            style={textStyleObj}
                        >
                            {/* Standard Overlay Cursors */}
                            {isCurrent && ['line', 'underline', 'neon-pulse'].includes(cursorStyle) && (
                                <span className={`absolute left-0 top-0 h-full min-w-[1ch] w-full ${CURSORS[cursorStyle]} pointer-events-none`} />
                            )}
                            
                            {/* Rainbow Cursors */}
                            {isCurrent && (cursorStyle === 'rainbow-vomit' || cursorStyle === 'exploding-rainbow-vomit') && (
                                <span className="absolute left-0 top-0 h-full w-[1ch] cursor-rainbow pointer-events-none mix-blend-screen" />
                            )}

                            {/* Kinetic Boxes */}
                            {isCurrent && cursorStyle === 'pulsing-box' && (
                                <span className="absolute inset-0 border-2 border-current animate-pulse pointer-events-none opacity-80" />
                            )}
                            {isJustTypedCorrectly && cursorStyle === 'pulsing-box' && (
                                <span className="absolute inset-0 border-2 border-current pointer-events-none animate-box-explode" />
                            )}
                            {isJustTypedCorrectly && cursorStyle === 'exploding-rainbow-vomit' && (
                                <span className="absolute left-1/2 top-1/2 w-2 h-2 -translate-x-1/2 -translate-y-1/2 rounded-full pointer-events-none animate-rainbow-particles" />
                            )}

                            {displayChar}
                        </span>
                    );
                });
            };

            return (
                <div 
                    className={`min-h-screen ${FONTS[font]} flex flex-col transition-all duration-300 ${theme === 'Paper' ? 'bg-paper-texture' : ''}`}
                    style={{ 
                        backgroundColor: currentSurface, 
                        color: currentInk,
                        '--theme-surface': currentSurface,
                        '--theme-panel': currentPanel,
                        '--theme-ink': currentInk
                    }}
                    onDragOver={(e) => e.preventDefault()}
                    onDrop={handleDrop}
                >
                    <header className="p-4 flex flex-wrap justify-between items-start border-b-2 border-current border-opacity-20 gap-4">
                        <h1 className="text-3xl font-bold tracking-tight mt-1 uppercase">TypoForge</h1>
                        
                        <div className="flex flex-col gap-3 items-end">
                            {/* Option Toggles */}
                            <div className="flex gap-4 text-sm font-sans tracking-wide font-bold uppercase opacity-80">
                                <label className="flex items-center gap-2 cursor-pointer hover:opacity-100 transition-opacity">
                                    <input type="checkbox" checked={isCodeMode} onChange={(e) => setIsCodeMode(e.target.checked)} className="accent-current" />
                                    Syntax
                                </label>
                                <label className="flex items-center gap-2 cursor-pointer hover:opacity-100 transition-opacity">
                                    <input type="checkbox" checked={ignoreCaps} onChange={(e) => setIgnoreCaps(e.target.checked)} className="accent-current" />
                                    No Caps
                                </label>
                                <label className="flex items-center gap-2 cursor-pointer hover:opacity-100 transition-opacity">
                                    <input type="checkbox" checked={tolerantWhitespace} onChange={(e) => setTolerantWhitespace(e.target.checked)} className="accent-current" />
                                    Lenient Whitespace
                                </label>
                            </div>

                            {/* Dropdowns */}
                            <div className="flex gap-2 text-sm items-center flex-wrap justify-end">
                                <select value={theme} onChange={(e) => setTheme(e.target.value)} className="bg-transparent border-2 border-current rounded-none px-2 py-1 font-bold outline-none cursor-pointer">
                                    {Object.keys(BRUTALIST_THEMES).map(k => <option key={k} value={k} style={{background: currentSurface, color: currentInk}}>{k}</option>)}
                                </select>

                                <select value={colorMode} onChange={(e) => setColorMode(e.target.value)} className="bg-transparent border-2 border-current rounded-none px-2 py-1 font-bold outline-none cursor-pointer">
                                    <option value="3-color" style={{background: currentSurface, color: currentInk}}>3-Color (Pop)</option>
                                    <option value="2-color" style={{background: currentSurface, color: currentInk}}>2-Color (Flat)</option>
                                </select>

                                <select value={font} onChange={(e) => setFont(e.target.value)} className="bg-transparent border-2 border-current rounded-none px-2 py-1 font-bold outline-none cursor-pointer">
                                    <option value="mono" style={{background: currentSurface, color: currentInk}}>Monospace</option>
                                    <option value="sans" style={{background: currentSurface, color: currentInk}}>Sans Serif</option>
                                    <option value="serif" style={{background: currentSurface, color: currentInk}}>Serif</option>
                                    <option value="space" style={{background: currentSurface, color: currentInk}}>Space Mono</option>
                                    <option value="typewriter" style={{background: currentSurface, color: currentInk}}>Special Elite</option>
                                    <option value="handwritten" style={{background: currentSurface, color: currentInk}}>Patrick Hand</option>
                                </select>

                                <select value={cursorStyle} onChange={(e) => setCursorStyle(e.target.value)} className="bg-transparent border-2 border-current rounded-none px-2 py-1 font-bold outline-none cursor-pointer">
                                    <option value="line" style={{background: currentSurface, color: currentInk}}>Line Cursor</option>
                                    <option value="block" style={{background: currentSurface, color: currentInk}}>Block Cursor</option>
                                    <option value="underline" style={{background: currentSurface, color: currentInk}}>Underline</option>
                                    <option value="neon-pulse" style={{background: currentSurface, color: currentInk}}>Neon Pulse</option>
                                    <option value="rainbow-vomit" style={{background: currentSurface, color: currentInk}}>Rainbow Vomit</option>
                                    <option value="pulsing-box" style={{background: currentSurface, color: currentInk}}>Pulsing Box</option>
                                    <option value="exploding-rainbow-vomit" style={{background: currentSurface, color: currentInk}}>Exploding Rainbow</option>
                                </select>
                            </div>
                        </div>
                    </header>

                    <main className="flex-grow flex flex-col items-center justify-center p-8 max-w-6xl mx-auto w-full">
                        <div className="w-full flex flex-wrap justify-between items-end mb-4 gap-4 uppercase font-bold">
                            <div className="flex gap-8">
                                <div className="text-5xl">{stats.wpm} <span className="text-sm opacity-60">WPM</span></div>
                                <div className="text-5xl">{stats.accuracy}% <span className="text-sm opacity-60">ACC</span></div>
                            </div>

                            {/* Brutalist Toolbar */}
                            <div className="flex gap-6 items-center border-2 border-current px-4 py-2">
                                {/* Font Size */}
                                <div className="flex items-center gap-3">
                                    <button onClick={() => setFontSize(Math.max(12, fontSize - 2))} className="w-8 h-8 flex items-center justify-center border border-current invert-on-hover text-xl" title="Decrease Font Size">−</button>
                                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="square">
                                        <polyline points="4 7 4 4 20 4 20 7"></polyline>
                                        <line x1="9" y1="20" x2="15" y2="20"></line>
                                        <line x1="12" y1="4" x2="12" y2="20"></line>
                                    </svg>
                                    <button onClick={() => setFontSize(Math.min(64, fontSize + 2))} className="w-8 h-8 flex items-center justify-center border border-current invert-on-hover text-xl" title="Increase Font Size">+</button>
                                </div>

                                {/* Spacing */}
                                <div className="flex items-center gap-3 border-l-2 border-current pl-6">
                                    <button onClick={() => setLetterSpacing(Math.max(-4, letterSpacing - 1))} className="w-8 h-8 flex items-center justify-center border border-current invert-on-hover text-xl" title="Decrease Spacing">−</button>
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="square">
                                        <path d="M6 3v18"></path>
                                        <path d="M18 3v18"></path>
                                        <path d="M10 12h4"></path>
                                        <path d="M12 9l3 3-3 3"></path>
                                        <path d="M12 9l-3 3 3 3"></path>
                                    </svg>
                                    <button onClick={() => setLetterSpacing(Math.min(12, letterSpacing + 1))} className="w-8 h-8 flex items-center justify-center border border-current invert-on-hover text-xl" title="Increase Spacing">+</button>
                                </div>
                            </div>

                            <div className="text-sm pb-2 text-right">
                                Chunk {currentChunkIndex + 1} / {textChunks.length}
                            </div>
                        </div>

                        {/* Typing Canvas */}
                        <div 
                            ref={typingAreaRef}
                            tabIndex={0}
                            onKeyDown={handleKeyDown}
                            onPaste={handlePaste}
                            className="w-full h-[60vh] overflow-y-auto p-8 border-4 border-current outline-none leading-relaxed whitespace-pre-wrap break-words focus:ring-4 ring-opacity-30 ring-current transition-all"
                            style={{ 
                                backgroundColor: currentPanel, 
                                fontSize: `${fontSize}px`, 
                                letterSpacing: `${letterSpacing}px`, 
                                scrollBehavior: 'smooth' 
                            }}
                        >
                            {renderText()}
                        </div>

                        <div className="mt-8 flex gap-4 items-center font-bold uppercase">
                            {status === 'finished_chunk' && (
                                <button onClick={nextChunk} className="px-6 py-3 border-4 border-current invert-on-hover">
                                    Next Chunk (Enter)
                                </button>
                            )}
                            {status === 'finished_all' && (
                                <div className="text-2xl">Session Complete.</div>
                            )}
                            
                            <button onClick={resetProgress} className="px-4 py-3 border-2 border-current border-opacity-50 invert-on-hover">
                                Restart
                            </button>
                            
                            <label className="cursor-pointer">
                                <input type="file" accept=".txt,.md,.js,.py,.jsx,.html,.css" onChange={handleDrop} className="hidden" />
                                <div className="px-4 py-3 border-2 border-dashed border-current invert-on-hover">
                                    Upload File
                                </div>
                            </label>
                        </div>
                    </main>

                    <footer className="p-4 text-center font-bold uppercase opacity-50 pb-8 text-sm">
                        Click the text box to start. Drag & drop a file, or paste text directly. 
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
